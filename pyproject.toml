[project]
name = "literature-labeller"
version = "0.1.0"
description = "Config-driven dashboard for manually labelling PubMed publications"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
literature-labeller = "literature_labeller.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
